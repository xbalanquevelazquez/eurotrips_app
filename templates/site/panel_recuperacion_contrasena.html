<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="{$siteURL}img/admin-eurotrips.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{$siteURL}css/basico.css">
	<link rel="stylesheet" href="{$siteURL}css/eurotrips_panel.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
	<script src="https://kit.fontawesome.com/609e2e7fda.js" crossorigin="anonymous"></script>
	<script type="text/javascript" src="{$siteURL}js/app.js"></script>
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
	<title>Eurotrips | Recuperar contraseña</title>
</head>
<body>
<div id="mainContainer" class="container row">
	<div class="col">
		
		<header class="row sombrear">
			<div class="col logo flex">
				<div><a href="{$siteURL}"><img src="img/logo-eurotrips-negro.png" alt="Eurotrips" /></a></div>
			</div>
		</header>
		<section class="mainSection home row">
			<div class="col col-12 col-md-8 mauto">
				<div class="innerContent">
					<div class="cardContainer fullWidth mb1 formDesign registerForm">
						<h2 class="ps2 pt2 pb1 mb1 bg-azulgris">Recuperar contraseña</h2>
							<form class="recuperacion-form" method="post">
								<div class="ps2 mb1">{$mensaje}</div>
								<div class="cf-turnstile ps2"
								     data-sitekey="{$TURNSTILE_SITE_KEY}">
								</div>
								<div class="row gap lineBelow">
									<div class="col col-12 ps2"><label>Correo electrónico <span class="obligatorio">*</span>:</label></div>
									<div id="msgCorreo" class="ps2"></div>
									<div class="col col-12 col-md-6 ps2">
										<input type="text" id="email" name="email" value="" class="requerido" />
									</div>
								</div>
								<div class="row">
									<div class="col ps2"><button type="submit" class="btn primario" id="sendForm"><i class="fa-solid fa-paper-plane"></i> &nbsp; <span>Enviar</span></button></div>
								</div>
							</form>
					</div><!--//.cardContainer-->
				</div>
			</div>
		</section>
	</div>
</div>
<script type="text/javascript">
$(document).ready(function(){
	//****************************
	$('#email').on('keyup change', function(){
		if (validarCorreo($(this).val())) {
		    $('#msgCorreo').html('Correo válido').removeClass('texto-alerta').addClass('texto-activo');
		} else {
		    $('#msgCorreo').html('Correo inválido').addClass('texto-alerta').removeClass('texto-activo');
		}
	});
	//****************************
	$('#sendForm').on('click', function(e){
	    if(!validarFormulario()){
	    	e.preventDefault();
	        alert('Hay campos obligatorios sin completar.');
	        return;
	    }
	    // Enviar formulario
	});
	//****************************
	$('.requerido').on('input change', function(e){
		let $campo = $(this);
        if(($campo.val() ?? '').trim() !== ''){
            $campo.removeClass('input-error');
        }
	});
});
function validarCorreo(correo){
    correo = (correo ?? '').trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo);
}
function validarFormulario(){

    let valido = true;

    $('.requerido').each(function(){

        let $campo = $(this);
        let valor = ($campo.val() ?? '').trim();

        if(valor === ''){
            $campo.addClass('input-error');
            valido = false;
        }else{
            $campo.removeClass('input-error');
        }

    });

    // Correo
    if(!validarCorreo($('#email').val())){
        valido = false;
    }
    return valido;
}
</script>
</body>
</html>
